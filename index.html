<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-400 min-h-screen flex items-center justify-center p-6 antialiased selection:bg-neutral-800 selection:text-neutral-200">

  <main class="text-center">
    <!-- Pulse Indicator -->
    <div class="mb-6 flex justify-center items-center gap-2">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
      </span>
    </div>

    <!-- Main Maintenance Message -->
    <p class="text-sm md:text-base font-light tracking-widest text-neutral-300 uppercase">
      Shaurya is p diddy.
    </p>
  </main>

</body>
</html>
