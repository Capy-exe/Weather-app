<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f8fafc;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #334155;
        }
        .temp-value {
            font-size: 3rem;
            font-weight: 800;
            margin: 0.5rem 0;
        }
        #status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Weather Dashboard</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. London, Tokyo)...">
            <button id="search-btn">Search</button>
        </div>

        <div class="card" id="weather-card">
            <div id="city-name" style="font-size: 1.2rem; color: #38bdf8; font-weight: 600;">Search for a city</div>
            <div id="temp" class="temp-value">--°C / --°F</div>
            <div id="status">Type any city above and click search</div>
        </div>
    </div>

    <script>
        document.getElementById('search-btn').addEventListener('click', async () => {
            const cityName = document.getElementById('city-input').value.trim();
            const cityNameEl = document.getElementById('city-name');
            const tempEl = document.getElementById('temp');
            const statusEl = document.getElementById('status');

            if (!cityName) return;

            // Show loading state
            cityNameEl.textContent = "Searching...";
            tempEl.textContent = "--°C / --°F";
            statusEl.textContent = "Looking up city coordinates...";

            try {
                // Step 1: Find latitude and longitude for the typed city name
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`;
                const geoResponse = await fetch(geoUrl);
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    cityNameEl.textContent = "City not found";
                    statusEl.textContent = "Please check the spelling and try again.";
                    return;
                }

                const location = geoData.results[0];
                const lat = location.latitude;
                const lon = location.longitude;
                const formalName = `${location.name}, ${location.country || ''}`;

                statusEl.textContent = "Fetching weather data...";

                // Step 2: Fetch the live temperature using those coordinates
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`;
                const weatherResponse = await fetch(weatherUrl);
                const weatherData = await weatherResponse.json();

                const tempC = weatherData.current.temperature_2m;
                const tempF = (tempC * 9/5) + 32;

                // Step 3: Update the screen with the real data
                cityNameEl.textContent = formalName;
                tempEl.textContent = `${Math.round(tempC)}°C / ${Math.round(tempF)}°F`;
                statusEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.error(error);
                cityNameEl.textContent = "Error";
                statusEl.textContent = "Could not retrieve weather data.";
            }
        });
    </script>

</body>
</html>
