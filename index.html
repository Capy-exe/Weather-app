<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top-Left Location Selector */
        .top-left-menu {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            width: 280px;
            z-index: 10;
        }
        .selector-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        .selector-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f8fafc;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .selector-input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .dropdown-results {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            margin-top: 0.25rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .dropdown-item {
            padding: 0.65rem 0.85rem;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #334155;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:hover {
            background: #334155;
            color: #38bdf8;
        }

        /* Main Container */
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            margin-top: 5rem;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            margin-bottom: 2rem;
        }
        .temp-value {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0.5rem 0;
            color: #38bdf8;
        }
        .weather-condition {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: capitalize;
        }
        .local-time {
            font-size: 0.95rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            display: inline-block;
            margin-top: 0.75rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        #status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 1rem;
        }

        /* Bookmarks */
        .bookmarks-section {
            text-align: left;
        }
        .bookmarks-section h2 {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 0.75rem;
        }
        .bookmark-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .bookmark-tag {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.4rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .bookmark-tag:hover {
            border-color: #38bdf8;
        }
        .remove-btn {
            color: #f43f5e;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btns {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }
        .btn-primary:hover {
            background: #0ea5e9;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
        }
        .btn-outline:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Top-Left Search / Dropdown Menu -->
    <div class="top-left-menu">
        <div class="selector-label">Search State / Country</div>
        <input type="text" id="location-search" class="selector-input" placeholder="Type city, state, country...">
        <div id="dropdown-results" class="dropdown-results"></div>
    </div>

    <div class="container">
        <h1>Weather Dashboard</h1>
        
        <div class="card" id="weather-card">
            <div id="city-name" style="font-size: 1.3rem; color: #f8fafc; font-weight: 600;">Select a location</div>
            <div id="condition" class="weather-condition">--</div>
            <div id="temp" class="temp-value">--°C</div>
            <div id="time-display"></div>
            <div id="status">Use the top-left menu to search locations</div>
            
            <div class="action-btns">
                <button id="bookmark-btn" class="btn btn-primary" style="display: none;">⭐ Bookmark</button>
            </div>
        </div>

        <div class="bookmarks-section">
            <h2>Saved Bookmarks</h2>
            <div id="bookmark-list" class="bookmark-list">
                <!-- Saved tags appear here -->
            </div>
        </div>
    </div>

    <script>
        let currentCityData = null;
        let searchTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            displayBookmarks();
            // Load a default city on startup (e.g., London)
            fetchWeatherData(51.5074, -0.1278, "London, United Kingdom", "Europe/London");
        });

        const searchInput = document.getElementById('location-search');
        const dropdown = document.getElementById('dropdown-results');

        // Live search dropdown as user types states/countries
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            if (query.length < 2) {
                dropdown.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5`);
                    const data = await res.json();

                    dropdown.innerHTML = '';
                    if (!data.results || data.results.length === 0) {
                        dropdown.style.display = 'none';
                        return;
                    }

                    data.results.forEach(loc => {
                        const item = document.createElement('div');
                        item.className = 'dropdown-item';
                        // Include state/admin region and country if available
                        const region = loc.admin1 ? `, ${loc.admin1}` : '';
                        const country = loc.country ? `, ${loc.country}` : '';
                        const displayName = `${loc.name}${region}${country}`;

                        item.textContent = displayName;
                        item.addEventListener('click', () => {
                            searchInput.value = displayName;
                            dropdown.style.display = 'none';
                            fetchWeatherData(loc.latitude, loc.longitude, displayName, loc.timezone);
                        });
                        dropdown.appendChild(item);
                    });

                    dropdown.style.display = 'block';
                } catch (err) {
                    console.error(err);
                }
            }, 300);
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.top-left-menu')) {
                dropdown.style.display = 'none';
            }
        });

        // Weather Code Translator for Open-Meteo
        function getWeatherCondition(code) {
            const conditions = {
                0: "Clear sky ☀️",
                1: "Mainly clear 🌤️",
                2: "Partly cloudy ⛅",
                3: "Overcast ☁️",
                45: "Foggy 🌫️",
                51: "Light drizzle 🌧️",
                61: "Rain showers 🌧️",
                71: "Snow fall ❄️",
                95: "Thunderstorm ⚡"
            };
            return conditions[code] || "Fair weather 🌤️";
        }

        async function fetchWeatherData(lat, lon, formalName, timezone) {
            const cityNameEl = document.getElementById('city-name');
            const conditionEl = document.getElementById('condition');
            const tempEl = document.getElementById('temp');
            const timeEl = document.getElementById('time-display');
            const statusEl = document.getElementById('status');
            const bookmarkBtn = document.getElementById('bookmark-btn');

            cityNameEl.textContent = formalName;
            conditionEl.textContent = "Loading weather...";
            tempEl.textContent = "--°C";
            timeEl.innerHTML = "";
            statusEl.textContent = "Fetching live data...";
            bookmarkBtn.style.display = "none";

            try {
                const tzParam = timezone ? `&timezone=${encodeURIComponent(timezone)}` : '';
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code${tzParam}`;
                
                const res = await fetch(weatherUrl);
                const data = await res.json();

                const tempC = Math.round(data.current.temperature_2m);
                const weatherText = getWeatherConnectionDescription(data.current.weather_code);
                
                // Get Local Time based on location's timezone
                let localTimeString = "";
                if (data.current.time) {
                    const dateObj = new Date(data.current.time);
                    localTimeString = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } else {
                    localTimeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                tempEl.textContent = `${tempC}°C`;
                conditionEl.textContent = weatherText;
                timeEl.innerHTML = `<span class="local-time">🕒 Local Time: ${localTimeString}</span>`;
                statusEl.textContent = `Updated successfully`;

                currentCityData = { name: formalName, lat, lon, timezone };
                bookmarkBtn.style.display = "inline-block";

            } catch (err) {
                console.error(err);
                conditionEl.textContent = "Error fetching data";
                statusEl.textContent = "Please try another location.";
            }
        }

        function getWeatherConnectionDescription(code) {
            return getWeatherCondition(code);
        }

        // Bookmark Logic
        document.getElementById('bookmark-btn').addEventListener('click', () => {
            if (!currentCityData) return;

            let saved = JSON.parse(localStorage.getItem('weatherBookmarks')) || [];
            if (!saved.some(c => c.name === currentCityData.name)) {
                saved.push(currentCityData);
                localStorage.setItem('weatherBookmarks', JSON.stringify(saved));
                displayBookmarks();
            }
        });

        function displayBookmarks() {
            const listEl = document.getElementById('bookmark-list');
            const saved = JSON.parse(localStorage.getItem('weatherBookmarks')) || [];

            listEl.innerHTML = '';
            if (saved.length === 0) {
                listEl.innerHTML = '<span style="color: #64748b; font-size: 0.85rem;">No saved cities yet.</span>';
                return;
            }

            saved.forEach(city => {
                const tag = document.createElement('div');
                tag.className = 'bookmark-tag';
                tag.innerHTML = `
                    <span onclick="fetchWeatherData(${city.lat}, ${city.lon}, '${city.name}', '${city.timezone || ''}')">${city.name}</span>
                    <span class="remove-btn" onclick="removeBookmark(event, '${city.name}')">×</span>
                `;
                listEl.appendChild(tag);
            });
        }

        function removeBookmark(event, nameToRemove) {
            event.stopPropagation();
            let saved = JSON.parse(localStorage.getItem('weatherBookmarks')) || [];
            saved = saved.filter(c => c.name !== nameToRemove);
            localStorage.setItem('weatherBookmarks', JSON.stringify(saved));
            displayBookmarks();
        }
    </script>
</body>
</html>
