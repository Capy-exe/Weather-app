<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f8fafc;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .card {
            background: #1e293b;
            padding: 1.75rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #334155;
            margin-bottom: 2rem;
        }
        .temp-value {
            font-size: 2.75rem;
            font-weight: 800;
            margin: 0.5rem 0;
        }
        #status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 1rem;
        }
        .bookmark-btn {
            display: none;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .bookmark-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }
        .bookmarks-section {
            text-align: left;
        }
        .bookmarks-section h2 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 0.75rem;
        }
        .bookmark-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .bookmark-tag {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.5rem 0.85rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .bookmark-tag:hover {
            border-color: #38bdf8;
        }
        .remove-btn {
            color: #f43f5e;
            font-weight: bold;
            cursor: pointer;
            margin-left: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Weather Dashboard</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. London, Tokyo)...">
            <button id="search-btn">Search</button>
        </div>

        <div class="card" id="weather-card">
            <div id="city-name" style="font-size: 1.2rem; color: #38bdf8; font-weight: 600;">Search for a city</div>
            <div id="temp" class="temp-value">--°C / --°F</div>
            <div id="status">Type any city above and click search</div>
            <button id="bookmark-btn" class="bookmark-btn"> Bookmark City</button>
        </div>

        <div class="bookmarks-section">
            <h2>Saved Bookmarks</h2>
            <div id="bookmark-list" class="bookmark-list">
                <!-- Saved city tags will appear here dynamically -->
            </div>
        </div>
    </div>

    <script>
        let currentCityData = null;

        // Load saved bookmarks when the page loads
        document.addEventListener('DOMContentLoaded', displayBookmarks);

        document.getElementById('search-btn').addEventListener('click', () => {
            const cityName = document.getElementById('city-input').value.trim();
            if (cityName) searchWeather(cityName);
        });

        async function searchWeather(cityName) {
            const cityNameEl = document.getElementById('city-name');
            const tempEl = document.getElementById('temp');
            const statusEl = document.getElementById('status');
            const bookmarkBtn = document.getElementById('bookmark-btn');

            cityNameEl.textContent = "Searching...";
            tempEl.textContent = "--°C / --°F";
            statusEl.textContent = "Looking up coordinates...";
            bookmarkBtn.style.display = "none";

            try {
                // 1. Fetch Geocoding
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    cityNameEl.textContent = "City not found";
                    statusEl.textContent = "Please check the spelling and try again.";
                    return;
                }

                const location = geoData.results[0];
                const formalName = `${location.name}, ${location.country || ''}`;

                // 2. Fetch Weather
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m`;
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                const tempC = Math.round(weatherData.current.temperature_2m);
                const tempF = Math.round((tempC * 9/5) + 32);

                // 3. Update Interface
                cityNameEl.textContent = formalName;
                tempEl.textContent = `${tempC}°C / ${tempF}°F`;
                statusEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;

                // Store current city details for bookmarking
                currentCityData = { name: formalName };
                bookmarkBtn.style.display = "inline-block";

            } catch (err) {
                console.error(err);
                cityNameEl.textContent = "Error";
                statusEl.textContent = "Could not load weather.";
            }
        }

        // Bookmark button event listener
        document.getElementById('bookmark-btn').addEventListener('click', () => {
            if (!currentCityData) return;

            let saved = JSON.parse(localStorage.getItem('weatherBookmarks')) || [];
            
            if (!saved.includes(currentCityData.name)) {
                saved.push(currentCityData.name);
                localStorage.setItem('weatherBookmarks', JSON.stringify(saved));
                displayBookmarks();
            }
        });

        // Function to render bookmarks on screen
        function displayBookmarks() {
            const listEl = document.getElementById('bookmark-list');
            const saved = JSON.parse(localStorage.getItem('weatherBookmarks')) || [];

            listEl.innerHTML = '';

            if (saved.length === 0) {
                listEl.innerHTML = '<span style="color: #64748b; font-size: 0.9rem;">No saved cities yet.</span>';
                return;
            }

            saved.forEach(city => {
                const tag = document.createElement('div');
                tag.className = 'bookmark-tag';
                tag.innerHTML = `
                    <span onclick="searchWeather('${city}')">${city}</span>
                    <span class="remove-btn" onclick="removeBookmark('${city}')">×</span>
                `;
                listEl.appendChild(tag);
            });
        }

        // Function to remove a bookmark
        function removeBookmark(cityToRemove) {
            let saved = JSON.parse(localStorage.getItem('weatherBookmarks')) || [];
            saved = saved.filter(c => c !== cityToRemove);
            localStorage.setItem('weatherBookmarks', JSON.stringify(saved));
            displayBookmarks();
        }
    </script>

</body>
</html>
